name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Usa il secret
        env:
          MY_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          echo "Il secret e' $MY_SECRET"
          echo "Primi 3 caratteri: ${MY_SECRET:0:3}"
          echo "Spezzato: ${MY_SECRET:0:5} ${MY_SECRET:5}"
          echo "Al contrario: $(echo $MY_SECRET | rev)"